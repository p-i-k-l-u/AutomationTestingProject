name: CI/CD Production Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  continuous-integration:
    name: Run Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Selenium Grid
        run: docker compose up -d

      - name: Wait for Selenium Grid
        run: |
          echo "Waiting for Selenium Grid to be ready..."
          until curl -s http://localhost:4444/status | grep -q '"ready": true'; do
            sleep 2
          done
          echo "Selenium Grid is ready!"

      - name: Create Config Properties File
        run: |
          mkdir -p src/main/resources
          echo "browser=chrome" > src/main/resources/config.properties
          echo "url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login" >> src/main/resources/config.properties
          echo "username=Admin" >> src/main/resources/config.properties
          echo "password=admin123" >> src/main/resources/config.properties

      - name: Run Maven Tests
        run: mvn clean test -DsuiteXmlFile=testng-ci.xml

      - name: Print Test Failure Details
        if: failure()
        run: |
          echo "=== Maven Test Failure Logs ==="
          for file in target/surefire-reports/*.txt; do
            if [ -f "$file" ]; then
              echo "--- Log: $file ---"
              cat "$file"
            fi
          done

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down

      - name: Upload Test Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            reports/
            screenshots/
